services:
  redis:
    image: redis:7-alpine
    container_name: redis

  ws-server-1:
    build: ./server
    container_name: ws-server-1
    environment:
      - SERVER_ID=server-1
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  ws-server-2:
    build: ./server
    container_name: ws-server-2
    environment:
      - SERVER_ID=server-2
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  ws-server-3:
    build: ./server
    container_name: ws-server-3
    environment:
      - SERVER_ID=server-3
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ws-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    depends_on:
      - ws-server-1
      - ws-server-2
      - ws-server-3
    restart: unless-stopped
