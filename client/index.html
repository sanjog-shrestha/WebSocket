<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WebSocket Checkpoint 5 — Scaled Chat</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
        }

        #status {
            font-weight: bold;
        }

        #status.connected {
            color: #16a34a;
        }

        #status.disconnected {
            color: #dc2626;
        }

        #log {
            border: 1px solid #ccc;
            border-radius: 8px;
            height: 320px;
            overflow-y: auto;
            padding: 12px;
            background: #fafafa;
            margin: 16px 0;
        }

        #log div {
            margin-bottom: 6px;
            font-size: 14px;
        }

        .system {
            color: #6b7280;
            font-style: italic;
        }

        .error {
            color: #dc2626;
            font-weight: bold;
        }

        .chat {
            color: #111827;
        }

        .chat b {
            color: #2563eb;
        }

        .server-tag {
            color: #9333ea;
            font-size: 12px;
        }

        form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
        }

        #join-screen {
            text-align: center;
            padding: 40px 0;
        }

        #join-screen input {
            margin: 4px 0;
            width: 220px;
        }

        .hidden {
            display: none;
        }

        #room-label {
            color: #6b7280;
            font-weight: normal;
        }
    </style>
</head>

<body>
    <h2>WebSocket Checkpoint 5 — Scaled Chat (Redis + Nginx)</h2>

    <div id="join-screen">
        <form id="join-form">
            <div><input id="username-input" placeholder="Username" autocomplete="off" /></div>
            <div><input id="room-input" placeholder="Room (default: general)" autocomplete="off" /></div>
            <button type="submit">Join Chat</button>
        </form>
        <p id="join-error" class="error"></p>
    </div>

    <div id="chat-screen" class="hidden">
        <p>
            Status: <span id="status" class="disconnected">connecting...</span>
            &nbsp;|&nbsp; <span id="room-label"></span>
        </p>
        <div id="log"></div>
        <form id="chat-form">
            <input id="chat-input" placeholder="Type a message..." autocomplete="off" />
            <button type="submit">Send</button>
        </form>
        <p style="color:#6b7280; font-size: 13px;">
            Purple tags show which server instance handled each event — open several
            tabs and watch different ones get picked by Nginx's load balancing.
        </p>
    </div>

    <script>
        const joinScreen = document.getElementById('join-screen');
        const chatScreen = document.getElementById('chat-screen');
        const joinForm = document.getElementById('join-form');
        const usernameInput = document.getElementById('username-input');
        const roomInput = document.getElementById('room-input');
        const joinError = document.getElementById('join-error');

        const statusEl = document.getElementById('status');
        const roomLabel = document.getElementById('room-label');
        const logEl = document.getElementById('log');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        function log(html, cls) {
            const div = document.createElement('div');
            div.className = cls;
            div.innerHTML = html;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        let ws;

        joinForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const room = roomInput.value.trim() || 'general';
            if (!username) return;

            joinError.textContent = '';

            // Connect through Nginx (port 8081), not directly to a server.
            ws = new WebSocket(`ws://${location.hostname}:8081/ws`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'join', username, room }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'error') {
                    joinError.textContent = data.message;
                    ws.close();
                    return;
                }

                if (data.type === 'joined') {
                    joinScreen.classList.add('hidden');
                    chatScreen.classList.remove('hidden');
                    statusEl.textContent = 'connected';
                    statusEl.className = 'connected';
                    roomLabel.textContent = `Room: #${data.room} — you are ${data.username}`;
                    log(`<span class="server-tag">[connected via ${data.server}]</span>`, 'system');
                    return;
                }

                const serverTag = data.server ? ` <span class="server-tag">[${data.server}]</span>` : '';

                if (data.type === 'system') {
                    log(data.message + serverTag, 'system');
                } else if (data.type === 'chat') {
                    log(`<b>${data.from}:</b> ${data.message}${serverTag}`, 'chat');
                }
            };

            ws.onclose = () => {
                statusEl.textContent = 'disconnected';
                statusEl.className = 'disconnected';
            };
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!chatInput.value) return;
            ws.send(JSON.stringify({ type: 'chat', message: chatInput.value }));
            chatInput.value = '';
        });
    </script>
</body>

</html>
